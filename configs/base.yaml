seed: 42
device: cpu
data:
  train_samples: 768
  validation_samples: 192
  test_samples: 192
  sequence_length: 6
  input_dim: 8
model:
  hidden_dim: 24
  num_classes: 2
  modules: [mlp, graph, attention]
router:
  strategy: soft
  temperature: 1.0
  compute_penalty: 0.01
training:
  epochs: 8
  batch_size: 64
  learning_rate: 0.003
evaluation:
  latency_warmup: 5
  latency_iterations: 20
